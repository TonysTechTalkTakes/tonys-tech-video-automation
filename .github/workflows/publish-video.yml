name: Publish reviewed video to YouTube

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Actions run ID that created the reviewed video artifact
        required: true
        type: string
      artifact_name:
        description: Exact artifact name from that Actions run
        required: true
        type: string
      format:
        description: Which reviewed MP4 to upload
        required: true
        type: choice
        options:
          - short
          - long
      title:
        description: YouTube title (up to 100 characters)
        required: true
        type: string
      description:
        description: YouTube description
        required: true
        type: string
      tags:
        description: Optional comma-separated tags
        required: false
        type: string
      privacy_status:
        description: Visibility for this upload
        required: true
        default: public
        type: choice
        options:
          - public
          - unlisted
          - private
      confirm_public:
        description: Check this box to approve publishing this video publicly
        required: false
        default: false
        type: boolean
      confirm_policy_review:
        description: Confirm you reviewed this video and it complies with YouTube policies
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Require deliberate public approval
        env:
          PRIVACY_STATUS: ${{ inputs.privacy_status }}
          CONFIRM_PUBLIC: ${{ inputs.confirm_public }}
          CONFIRM_POLICY_REVIEW: ${{ inputs.confirm_policy_review }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          ARTIFACT_NAME: ${{ inputs.artifact_name }}
        run: |
          if [[ ! "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "Source run ID must contain digits only." >&2
            exit 1
          fi
          if [ -z "$ARTIFACT_NAME" ]; then
            echo "Artifact name is required." >&2
            exit 1
          fi
          if [ "$CONFIRM_POLICY_REVIEW" != "true" ]; then
            echo "Upload blocked. Confirm that you reviewed this video and it complies with YouTube policies." >&2
            exit 1
          fi
          if [ "$PRIVACY_STATUS" = "public" ] && [ "$CONFIRM_PUBLIC" != "true" ]; then
            echo "Public upload blocked. Check the public approval box for this video." >&2
            exit 1
          fi

      - name: Check out uploader
        uses: actions/checkout@v7

      - name: Download reviewed video artifact
        uses: actions/download-artifact@v5
        with:
          name: ${{ inputs.artifact_name }}
          run-id: ${{ inputs.source_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: downloaded
          merge-multiple: true

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Select and verify video
        env:
          VIDEO_FORMAT: ${{ inputs.format }}
        run: |
          if [ "$VIDEO_FORMAT" = "long" ]; then
            source=downloaded/tonys-tech-long.mp4
            expected=1920x1080
          else
            source=downloaded/tonys-tech-short.mp4
            expected=720x1280
          fi
          test -s "$source"
          dimensions=$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=s=x:p=0 "$source")
          test "$dimensions" = "$expected"
          ffmpeg -v error -i "$source" -f null -
          cp "$source" video-to-upload.mp4

      - name: Install YouTube API client
        run: python -m pip install --disable-pip-version-check -r requirements-youtube.txt

      - name: Upload with selected visibility
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          VIDEO_TITLE: ${{ inputs.title }}
          VIDEO_DESCRIPTION: ${{ inputs.description }}
          VIDEO_TAGS: ${{ inputs.tags }}
          PRIVACY_STATUS: ${{ inputs.privacy_status }}
        run: |
          python scripts/upload_youtube.py \
            --file video-to-upload.mp4 \
            --title "$VIDEO_TITLE" \
            --description "$VIDEO_DESCRIPTION" \
            --tags "$VIDEO_TAGS" \
            --privacy-status "$PRIVACY_STATUS"
