
name: Video Test

on: workflow_dispatch

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Generate video
        run: ffmpeg -f lavfi -i color=c=blue:s=720x1280:d=5 -c:v libx264 -pix_fmt yuv420p -y test.mp4

      - name: Save video
        uses: actions/upload-artifact@v4
        with:
          name: test-video
          path: test.mp4
