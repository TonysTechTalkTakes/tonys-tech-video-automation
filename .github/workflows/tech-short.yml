
name: Tony's Tech Short

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Install video and voice tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --user edge-tts

      - name: Create natural male narration
        run: |
          python -m edge_tts --voice en-US-GuyNeural --rate=-5% --text "Three simple phone battery tips. First, avoid extreme heat. Second, turn on optimized charging if your phone supports it. Third, reduce screen brightness when possible. Subscribe to Tony's Tech Talk Takes for more tech tips!" --write-media voice.mp3

      - name: Create video
        run: |
          ffmpeg -f lavfi -i color=c=0x102448:s=720x1280:r=30 -i voice.mp3 -vf "drawtext=text='TONYS TECH TALK TAKES':fontcolor=white:fontsize=35:x=(w-text_w)/2:y=200,drawtext=text='3 PHONE BATTERY TIPS':fontcolor=cyan:fontsize=43:x=(w-text_w)/2:y=450,drawtext=text='HEAT  |  CHARGING  |  BRIGHTNESS':fontcolor=white:fontsize=25:x=(w-text_w)/2:y=650,drawtext=text='SUBSCRIBE FOR MORE':fontcolor=yellow:fontsize=34:x=(w-text_w)/2:y=1000" -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest -y tech-short.mp4

      - name: Save video
        uses: actions/upload-artifact@v4
        with:
          name: tonys-tech-short-natural-voice
          path: tech-short.mp4
